name: Validate source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate inventory structure
        run: python tools/validate_icon_inventory.py

      - name: Compile Python tools
        run: python -m compileall -q tools
