name: Release builder

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Validate source and build plan
        run: |
          python tools/validate_icon_inventory.py
          python tools/validate_icon_build.py
          python tools/validate_icon_build.py --output-root . --report-path assets/manifest/release_build.json
          python -m compileall -q tools

      - name: Package game add-on and source builder
        shell: bash
        run: |
          game_archive="AnomalyHope-PDA-Icons-${GITHUB_REF_NAME}.zip"
          source_archive="${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}-source.zip"
          zip -r "${game_archive}" gamedata -x '*/.gitkeep'
          mkdir -p dist/package
          cp README.md CHANGELOG.md LICENSE requirements.txt dist/package/
          cp -a assets docs tools dist/package/
          find dist/package -type d -name '__pycache__' -prune -exec rm -rf {} +
          (cd dist/package && zip -r "../../${source_archive}" .)
          test "$(unzip -Z1 "${game_archive}" | grep -c '^gamedata/')" -gt 0
          ! unzip -Z1 "${game_archive}" | grep -E 'build_report|__pycache__|\.py$|/\.gitkeep$'
          echo "GAME_ARCHIVE=${game_archive}" >> "${GITHUB_ENV}"
          echo "SOURCE_ARCHIVE=${source_archive}" >> "${GITHUB_ENV}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${GAME_ARCHIVE}" "${SOURCE_ARCHIVE}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
