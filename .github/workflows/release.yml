name: Release builder

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Validate source and build plan
        run: |
          python tools/validate_icon_inventory.py
          python tools/validate_icon_build.py
          python -m compileall -q tools

      - name: Package local builder
        shell: bash
        run: |
          archive="${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}.zip"
          mkdir -p dist/package
          cp README.md CHANGELOG.md LICENSE requirements.txt dist/package/
          cp -a assets docs tools dist/package/
          find dist/package -type d -name '__pycache__' -prune -exec rm -rf {} +
          (cd dist/package && zip -r "../../${archive}" .)
          echo "ARCHIVE=${archive}" >> "${GITHUB_ENV}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${ARCHIVE}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
